name: Build Binary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-actui:
    name: Build actui binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 24 compatible
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0, Node 24 compatible
        with:
          go-version-file: go.mod

      - name: Compute next version tag
        id: compute-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          printf '%s\n' "$NEXT_TAG" > release-version.txt
          echo "tag_name=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build actui
        env:
          RELEASE_TAG: ${{ steps.compute-version.outputs.tag_name }}
        run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${RELEASE_TAG#v}" -o actui ./cmd/actui

      # T003 (US1): Generate SBOM from the repository source tree immediately after the binary
      # is compiled. Syft resolves the full Go module dependency graph from go.mod/go.sum
      # and writes an SPDX 2.3 JSON document. upload-artifact is disabled here so the
      # artifact name and retention policy are controlled explicitly in the next step.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.15.0, composite action
        with:
          format: spdx-json
          output-file: actui-darwin-arm64.spdx.json
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, Node 24 compatible
        with:
          name: actui-darwin-arm64
          path: actui
          if-no-files-found: error
          retention-days: 14

      # T004 (US2): Upload the SBOM as a separately named artifact so it is independently
      # downloadable from the workflow run and consumable by the release workflow.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, Node 24 compatible
        with:
          name: actui-darwin-arm64-sbom
          path: actui-darwin-arm64.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release version artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, Node 24 compatible
        with:
          name: release-version
          path: release-version.txt
          if-no-files-found: error
          retention-days: 14
